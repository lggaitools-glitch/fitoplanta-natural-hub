name: Build and regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
          VITE_SUPABASE_PROJECT_ID: ''
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json
